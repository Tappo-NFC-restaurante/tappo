services:
  # Serviço Web Full-Stack com WebSockets nativos
  - type: web
    name: tappo-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tappo-postgres
          property: connectionString

databases:
  - name: tappo-postgres
    plan: free
    region: oregon
    databaseName: tappo_db
    user: tappo_user
