services:
  postgres:
    image: postgres:16-alpine
    container_name: tappo-postgres
    restart: always
    environment:
      POSTGRES_USER: tappo_user
      POSTGRES_PASSWORD: tappo_password
      POSTGRES_DB: tappo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tappo_user -d tappo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
